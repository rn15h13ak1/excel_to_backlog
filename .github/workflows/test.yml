name: test

on:
  push:
    branches: [main]
  pull_request:
  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # README が要求する下限（3.10）と、開発環境（3.12）で確認する
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存関係をインストール
        run: pip install -e ".[dev]" pytest-cov

      - name: テストを実行
        # branch = true は pyproject.toml で指定済み。
        # 下限を下回ったら失敗させ、カバレッジの後退に気づけるようにする。
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=95
