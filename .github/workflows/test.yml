name: test

on:
  push:
    branches: [main]
  pull_request:
  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # requires-python が許す範囲の両端を見る。下限（3.10）と開発環境
        # （3.12）だけでは、新しい Python で依存の挙動が変わっても気づけない。
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存関係をインストール
        # pytest / pytest-cov / mutmut は pyproject の dev に含まれている
        run: pip install -e ".[dev]"

      - name: テストを実行
        # branch = true は pyproject.toml で指定済み。
        # 下限を下回ったら失敗させ、カバレッジの後退に気づけるようにする。
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=95
