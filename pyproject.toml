[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-to-backlog"
version = "0.1.0"
description = "Excel ファイルから Backlog の課題を一括登録・更新する CLI ツール"
requires-python = ">=3.10"

dependencies = [
    # 3.1 以降で openpyxl.cell.rich_text が利用できる。
    # これより古いと rich_text: true を設定しても取り消し線が反映されず、
    # stderr の警告 1 行だけで静かに機能が失われる。
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

# `excel-to-backlog` として実行できるようにする。
# python のパスや作業ディレクトリを意識せずに済む。
[project.scripts]
excel-to-backlog = "excel_to_backlog:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "mutmut>=3.0"]

# モジュールがリポジトリ直下に並ぶ構成（flat-layout）のため、
# setuptools の自動検出では「トップレベルモジュールが複数ある」と判断されて
# ビルドが失敗する。対象を明示する。
[tool.setuptools]
py-modules = [
    "excel_to_backlog",
    "excel_reader",
    "mapper",
    "backlog_client",
    "run_log",
    "summary_index",
    "config_validation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# モジュールがリポジトリ直下にあるため、テストから import できるようにする
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]
# 行が実行されたかだけでなく、条件の両方の枝を通ったかを測る。
# try の範囲を変えるような構造的な変更は行数を変えないため、
# 行カバレッジでは検出できない経路が残る。
branch = true

# 変異テスト。意図的にコードを壊してテストが落ちるかを確認する。
# カバレッジが「テストが触れていない場所」を示すのに対し、変異テストは
# 「触れているが検証できていない場所」を示す。
#
# 全モジュールを列挙するのは、mutmut が source_paths のみを mutants/ へ
# 複製するため。一部だけ指定すると他モジュールを import できず起動に失敗する。
[tool.mutmut]
source_paths = [
    "excel_to_backlog.py",
    "mapper.py",
    "excel_reader.py",
    "backlog_client.py",
    "run_log.py",
    "summary_index.py",
    "config_validation.py",
]
